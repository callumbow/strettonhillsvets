name: Create original equine foreground cutout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/make-horse-cutout.yml'
permissions:
  contents: write
jobs:
  make-cutout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Make transparent cutout from the practice's own photograph
        run: |
          python -m pip install --quiet pillow numpy opencv-python-headless
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np,cv2
          im=Image.open('assets/images/chestnut-horse-closeup.webp').convert('RGB')
          w,h=im.size
          pts=np.array([(0,270),(85,281),(183,244),(243,227),(277,187),(299,125),(330,46),(357,63),(379,170),(416,189),(455,210),(501,152),(525,72),(552,99),(565,215),(604,305),(635,388),(656,531),(680,691),(715,784),(749,855),(772,922),(777,990),(740,1061),(690,1090),(646,1084),(604,1049),(570,1014),(510,942),(454,889),(397,850),(339,836),(272,845),(212,844),(159,873),(116,923),(58,1035),(0,1101)],np.int32)
          poly=np.zeros((h,w),np.uint8);cv2.fillPoly(poly,[pts],255)
          interior=cv2.erode(poly,cv2.getStructuringElement(cv2.MORPH_ELLIPSE,(31,31)),iterations=1)
          outer=cv2.dilate(poly,cv2.getStructuringElement(cv2.MORPH_ELLIPSE,(37,37)),iterations=1)
          mask=np.full((h,w),cv2.GC_BGD,np.uint8)
          mask[outer>0]=cv2.GC_PR_BGD
          mask[poly>0]=cv2.GC_PR_FGD
          mask[interior>0]=cv2.GC_FGD
          rgb=np.array(im)
          cv2.grabCut(cv2.cvtColor(rgb,cv2.COLOR_RGB2BGR),mask,None,np.zeros((1,65),np.float64),np.zeros((1,65),np.float64),9,cv2.GC_INIT_WITH_MASK)
          matte=np.where(np.isin(mask,[cv2.GC_FGD,cv2.GC_PR_FGD]),255,0).astype(np.uint8)
          count,labels,stats,_=cv2.connectedComponentsWithStats(matte)
          if count>2:matte=np.where(labels==np.argmax(stats[1:,cv2.CC_STAT_AREA])+1,255,0).astype('uint8')
          matte=cv2.GaussianBlur(matte,(5,5),1.15)
          y,x=np.indices((h,w))
          light=(rgb.min(axis=2)>215)&((rgb.max(axis=2).astype(int)-rgb.min(axis=2).astype(int))<30)
          matte[light&(y<320)]=0
          out=im.convert('RGBA');out.putalpha(Image.fromarray(matte))
          dst=Path('assets/images/horse-cutout.png');out.save(dst,optimize=True)
          print('PNG:',dst.stat().st_size,'pixels:',out.size)
          assert dst.stat().st_size>250000
          PY
      - name: Publish foreground asset
        run: |
          git add assets/images/horse-cutout.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add original transparent horse foreground PNG'
          git push origin HEAD:main
