name: Apply original logo to every page
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-horse-logo-pages.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update header footer and about logo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages=list(Path('.').rglob('*.html'))
          p=re.compile(r'<span class="brand-symbol" aria-hidden="true"><svg[\s\S]*?</svg></span>')
          new='<span class="brand-symbol" aria-hidden="true"><img src="/assets/images/logo-mark.png" width="58" height="58" alt=""></span>'
          changed=0
          for path in pages:
            s=path.read_text()
            s,n=p.subn(new,s)
            changed+=n
            s=s.replace('/assets/images/original-logo.webp','/assets/images/logo-original-transparent.png')
            if 'rel="apple-touch-icon"' not in s and '<head>' in s:s=s.replace('</head>','<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"></head>')
            path.write_text(s)
          assert changed>=30,changed
          css=Path('assets/css/style.css')
          css.write_text(css.read_text()+'''
          /* Original horse insignia and harmonised brand palette */
          .brand-symbol{width:54px;height:54px;display:flex;justify-content:center;align-items:center;flex:none}
          .brand-symbol img{width:100%;height:100%;object-fit:contain;display:block}
          .brand-primary{color:#7f916b}
          .brand-secondary{color:#274538}
          .brand--footer .brand-symbol{width:54px;height:54px}
          .brand--footer .brand-primary{color:#d2dec9}
          .brand--footer .brand-secondary{color:#dbe7da}
          .original-identity img{border:0;background:transparent;mix-blend-mode:normal;filter:none}
          @media(max-width:950px){.brand-symbol{width:47px;height:47px}}
          @media(max-width:690px){.brand-symbol{width:42px;height:42px}.brand-primary{font-size:24px}.brand-secondary{font-size:6px}}
          ''')
          print('Replaced',changed,'original brand placements across',len(pages),'pages')
          PY
      - name: Commit original logo across site
        run: |
          git add .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use original equine logo in every header footer and about section'
          git push origin HEAD:main
