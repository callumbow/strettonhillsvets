name: Restore Stretton Hills Vets site
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-stretton-site.yml'
permissions:
  contents: write
jobs:
  restore:
    if: github.repository == 'callumbow/strettonhillsvets'
    runs-on: ubuntu-latest
    steps:
      - name: Check out all history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Restore the approved website archive from Git history
        shell: bash
        run: |
          set -euo pipefail
          git show 5d519efdaf5f1ead6ba4e424ccb3f4d1119063e4:stretton-hills-vets-website.zip > /tmp/stretton-hills-vets-website.zip
          unzip -tqq /tmp/stretton-hills-vets-website.zip
          unzip -Z1 /tmp/stretton-hills-vets-website.zip | grep -qx 'index.html'
          unzip -Z1 /tmp/stretton-hills-vets-website.zip | grep -qx 'assets/css/style.css'
          unzip -Z1 /tmp/stretton-hills-vets-website.zip | grep -qx 'services/emergency-care/index.html'
          git rm -f -- chestnut-horse-closeup.webp favicon.svg foal-closeup.webp grey-horse-closeup.webp horses-hero.webp main.js mare-foal.webp original-logo.webp social-preview.jpg style.css
          unzip -oq /tmp/stretton-hills-vets-website.zip -d .
          test -s index.html
          test -s assets/css/style.css
          test -s assets/images/horses-hero.webp
          test -s services/emergency-care/index.html
          test -f CNAME
          grep -qx 'theequinevet.co.uk' CNAME
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore complete website folder structure and all pages'
          git push origin HEAD:main
