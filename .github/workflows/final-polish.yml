name: Finish favicon assets and verify site
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate production PNG and ICO icons
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          p=Path('assets');p.mkdir(exist_ok=True)
          for size,name in [(512,'icon-512.png'),(192,'icon-192.png'),(180,'apple-touch-icon.png'),(64,'favicon-64.png')]:
              s=size/128
              im=Image.new('RGB',(size,size),'#17372e')
              d=ImageDraw.Draw(im)
              def pts(seq):return [(int(x*s),int(y*s)) for x,y in seq]
              d.line(pts([(21,80),(43,53),(59,69),(77,46),(108,82)]),fill='#eee8d8',width=max(2,int(6*s)),joint='curve')
              d.arc((int(17*s),int(67*s),int(112*s),int(112*s)),start=190,end=338,fill='#adb99a',width=max(2,int(5*s)))
              d.line(pts([(59,35),(71,35)]),fill='#cbb28b',width=max(2,int(4*s)))
              im.save(p/name,optimize=True)
          ico=Image.open(p/'icon-512.png')
          ico.save('favicon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64)])
          PY
          git add favicon.ico assets/icon-512.png assets/icon-192.png assets/apple-touch-icon.png assets/favicon-64.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate cross-device favicon and touch icons'
          git push origin HEAD:main
      - name: Verify HTML, links, schema and image references
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json,re
          root=Path('.')
          pages=list(root.glob('**/index.html'))
          assert len(pages)==17,len(pages)
          broken=[]
          class Parser(HTMLParser):
              def __init__(self,path):super().__init__();self.path=path
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  for v in ('href','src'):
                      u=d.get(v,'')
                      if u.startswith('/') and not u.startswith('//'):
                          path=root / u.lstrip('/').split('#')[0].split('?')[0]
                          if path.is_dir():path=path/'index.html'
                          if not path.exists():broken.append((str(self.path),u))
          for page in pages:
              html=page.read_text()
              assert '<title>' in html and 'description' in html and 'canonical' in html
              assert 'favicon.ico' in html
              Parser(page).feed(html)
              for s in re.findall(r'<script type="application/ld\+json">(.*?)</script>',html,re.S):json.loads(s)
          print('HTML pages:',len(pages),'Broken internal references:',broken)
          assert not broken,broken
          PY
